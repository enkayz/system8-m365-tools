# System8 Test my 365 — static dashboard and one exact public provisioning helper.
server {
    listen 80;
    listen [::]:80;
    server_name 365.system8.com.au;
    access_log off;
    error_log /var/log/nginx/365.system8.error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-365.system8.com.au;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://365.system8.com.au$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 365.system8.com.au;
    root /var/www/365.system8.com.au/current;
    ssl_certificate /etc/letsencrypt/live/365.system8.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/365.system8.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    autoindex off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/365.system8.error.log crit;
    client_max_body_size 1k;
    set $s8_frame_ancestors "'none'";
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args != "") { return 400; }
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://login.microsoftonline.com https://graph.microsoft.com; frame-src https://login.microsoftonline.com; base-uri 'none'; form-action 'none'; frame-ancestors $s8_frame_ancestors" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Allow "GET, HEAD" always;
    # No COOP: MSAL5 bridge needs its browsing-context communication channel.
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /redirect.html {
        set $s8_frame_ancestors "'self'";
        try_files $uri =404;
    }
    # Public, inspectable customer-operated script. Never execute Python on the host.
    location = /setup/create-connection.py {
        types { text/plain py; }
        default_type text/plain;
        try_files $uri =404;
    }
    # Programme tools: exact reviewed static allowlist; no catchall.
    location = /tools/credential-coverage/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/credential-coverage/index.html =404; }
    location = /tools/credential-coverage/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/credential-coverage/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/credential-coverage/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/credential-coverage/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/change-window-review/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/change-window-review/index.html =404; }
    location = /tools/change-window-review/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/change-window-review/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/change-window-review/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/change-window-review/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/exchange-alias-claims/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/exchange-alias-claims/index.html =404; }
    location = /tools/exchange-alias-claims/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/exchange-alias-claims/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/exchange-alias-claims/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/exchange-alias-claims/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/mail-dns-cutover/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/mail-dns-cutover/index.html =404; }
    location = /tools/mail-dns-cutover/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/mail-dns-cutover/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/mail-dns-cutover/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/mail-dns-cutover/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/sharepoint-path-budget/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/sharepoint-path-budget/index.html =404; }
    location = /tools/sharepoint-path-budget/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/sharepoint-path-budget/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/sharepoint-path-budget/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/sharepoint-path-budget/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/license-assignment-reconcile/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/license-assignment-reconcile/index.html =404; }
    location = /tools/license-assignment-reconcile/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/license-assignment-reconcile/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/license-assignment-reconcile/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/license-assignment-reconcile/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools { return 301 /tools/; }
    location = /tools/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/index.html =404; }
    location = /tools/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/permission-change-review/app.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/permission-change-review/core.mjs { root /var/www/365.system8.com.au/tools-current; types { application/javascript mjs; } try_files $uri =404; }
    location = /tools/permission-change-review/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/permission-change-review/index.html =404; }
    location = /tools/permission-change-review/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location = /tools/permission-change-review/style.css { root /var/www/365.system8.com.au/tools-current; types { text/css css; } try_files $uri =404; }
    location = /tools/redirect-uri-audit/Audit-RedirectURIChanged.kql { root /var/www/365.system8.com.au/tools-current; types { text/plain kql; } try_files $uri =404; }
    location = /tools/redirect-uri-audit/LICENSE.txt { root /var/www/365.system8.com.au/tools-current; types { text/plain txt; } try_files $uri =404; }
    location = /tools/redirect-uri-audit/ { root /var/www/365.system8.com.au/tools-current; try_files /tools/redirect-uri-audit/index.html =404; }
    location = /tools/redirect-uri-audit/index.html { root /var/www/365.system8.com.au/tools-current; types { text/html html; } try_files $uri =404; }
    location ~ ^/assets/[A-Za-z0-9_-]+\.(js|css)$ { try_files $uri =404; }
    location / { return 404; }
}
